
services:
  nuclear-option-server-compose:
    build:
      context: .
      dockerfile: Dockerfile
    tty: true
    stdin_open: true
    container_name: NO_Compose
    restart: unless-stopped

    ports:
      - "7777:7777/udp"
      - "7778:7778/udp"

    environment:
      DOCKER_HOST: http://socket-proxy:2375

    volumes:
      # BepInEx config files (settings.json, etc.)
      - ./config/BepInEx/config:/home/steam/Steam/steamapps/common/NuclearOptionServer/BepInEx/config

      # Dedicated server JSON config
      - ./config/DedicatedServerConfig.json:/home/steam/Steam/steamapps/common/NuclearOptionServer/DedicatedServerConfig.json

      # User missions (everything inside the folder is copied verbatim)
      - ./config/missions:/home/steam/NuclearOption-Missions

      # BepInEx plugins
      - ./config/BepInEx/plugins:/home/steam/plugins

      # Ban list file
      - ./config/ban_list.txt:/home/steam/Steam/steamapps/common/NuclearOptionServer/ban_list.txt

      # BepInEx log output
      - ./config/BepInEx/LogOutput.log:/home/steam/Steam/steamapps/common/NuclearOptionServer/BepInEx/LogOutput.log

      # CA certificates for the embedded gRPC implementation.
      - ./CA:/home/steam/Steam/steamapps/common/NuclearOptionServer/CA

  socket-proxy:
    restart: always
    privileged: true
    image: tecnativa/docker-socket-proxy
    container_name: socket-proxy
    environment:
      INFO: 1
      CONTAINERS: 1
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      GRPC: 0
      IMAGES: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
      ALLOW_RESTARTS: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock